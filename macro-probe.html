<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RT75 Macro Probe</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --fg: #15171c; --muted: #6b7180; --line: #dde0e6; --hit: #0f9d8a; --err: #c92a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1013; --fg: #e8eaef; --muted: #8d94a3; --line: #2a2f39; --hit: #2ec4ad; --err: #ff6b6b; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 12px; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--hit); color: #fff; cursor: pointer; }
  button.secondary { background: none; color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: color-mix(in oklab, var(--bg) 80%, var(--line)); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; }
  .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>Macro probe (read-only)</h1>
  <p>Reads the raw bytes of macro slots 1–8, and which macro each key uses on every profile and on the Fn layer. It only sends read
     commands (0x8F, 0x8A, 0x90, 0x8B); nothing on the keyboard changes. Close qmk.top and RT75 Studio first.</p>
  <p><button id="go" type="button">Connect and read</button> <button id="copy" class="secondary" type="button" disabled>Copy result</button></p>
  <pre id="log">Waiting.</pre>
</main>
<script>
const logEl = document.getElementById('log');
const lines = [];
const log = (s, cls) => { lines.push(s); const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; logEl.appendChild(d); };
const hex = a => [...a].map(b => b.toString(16).padStart(2, '0')).join(' ');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DONGLE_PIDS = new Set([0x5037, 0x5038, 0x503d]);
const READ_ONLY = new Set([0x8f, 0x8a, 0x90, 0x8b]);

function encode(cmd) {
  const buf = new Uint8Array(64); buf.set(cmd);
  buf[7] = 255 - (buf.slice(0, 7).reduce((a, b) => a + b, 0) & 0xff);
  return buf;
}
async function rawSend(dev, bytes) { const b = new Uint8Array(64); b.set(bytes); await sleep(10); await dev.sendFeatureReport(0, b); }
async function rawRead(dev) { await sleep(10); return new Uint8Array((await dev.receiveFeatureReport(0)).buffer); }
function transport(dev) {
  const viaDongle = DONGLE_PIDS.has(dev.productId);
  const status = async () => { await rawSend(dev, [0xf7]); const r = await rawRead(dev); return { canRead: r[0] === 1, canSend: r[5] === 1 }; };
  const waitFor = async k => { for (let i = 0; i < 10; i++) { await sleep(100); if ((await status())[k]) return true; } return false; };
  return async cmd => {
    if (!READ_ONLY.has(cmd[0])) throw new Error('blocked non-read command 0x' + cmd[0].toString(16));
    // Macro reads beyond the 50 slots return unrelated memory, and index 254/255 hung the keyboard.
    if (cmd[0] === 0x8b && !(cmd[1] < 50 && cmd[2] < 4)) throw new Error(`blocked macro read outside slots 0–49 / pages 0–3 (${cmd[1]}, ${cmd[2]})`);
    if (cmd[0] === 0x90 && !(cmd[1] <= 1 && cmd[2] === 0 && cmd[4] < 8)) throw new Error('blocked Fn-layer read outside layer 0');
    if (cmd[0] === 0x8a && !(cmd[1] < 4 && cmd[3] < 8)) throw new Error('blocked key-map read outside profiles 1–4');
    const pkt = encode(cmd);
    if (!viaDongle) { await sleep(10); await dev.sendFeatureReport(0, pkt); return rawRead(dev); }
    await rawSend(dev, [0xf6, 0x0a]);
    if (!await waitFor('canSend')) throw new Error('dongle not ready');
    await sleep(10); await dev.sendFeatureReport(0, pkt);
    if (!await waitFor('canRead')) throw new Error('dongle has no reply');
    await rawSend(dev, [0xfc]);
    return rawRead(dev);
  };
}

document.getElementById('go').onclick = async () => {
  logEl.textContent = ''; lines.length = 0;
  if (!('hid' in navigator)) { log('WebHID is not available. Use Chrome or Edge.', 'err'); return; }
  const devs = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x3151, usagePage: 0xffff }] }).catch(() => []);
  const dev = devs.find(d => d.collections.some(c => c.featureReports.length));
  if (!dev) { log('No keyboard picked.', 'err'); return; }
  const go = document.getElementById('go'); go.disabled = true;
  try {
    if (!dev.opened) await dev.open();
    const q = transport(dev);
    const id = await q([0x8f]);
    const deviceId = new DataView(id.buffer).getUint32(1, true);
    log(`Device ID ${deviceId}, fw 0x${((id[8] << 8) | id[7]).toString(16)}${DONGLE_PIDS.has(dev.productId) ? ' (2.4G)' : ' (USB)'}`);
    if (deviceId !== 2865) { log('Not the RT75 Pro; stopping.', 'err'); return; }

    log('\nKeys that run a macro  [9, mode, index, 0]:');
    const show = (where, arr) => { for (let s = 0; s < 128; s++) if (arr[s * 4] === 9) log(`  ${where} slot ${s}: ${hex(arr.slice(s * 4, s * 4 + 4))}  → Macro ${arr[s * 4 + 2] + 1}`); };
    for (let profile = 0; profile < 4; profile++) {
      const base = [];
      for (let p = 0; p < 8; p++) base.push(...await q([0x8a, profile, 0xff, p, 0]));
      show(`profile ${profile + 1} base`, base);
    }
    // The RT75 has a single Fn layer (index 0) shared by all profiles, like qmk.top's "Fn Profile 1".
    for (const [os, name] of [[0, 'Fn · Windows'], [1, 'Fn · Mac']]) {
      const fn = [];
      for (let p = 0; p < 8; p++) fn.push(...await q([0x90, os, 0, 0xff, p]));
      show(name, fn);
    }

    log('\nRaw macro slots  [0x8B, index, page], 64 bytes per page:');
    for (let idx = 0; idx < 8; idx++) {
      log(`Macro ${idx + 1} (index ${idx}):`);
      for (let page = 0; page < 4; page++) {
        const r = await q([0x8b, idx, page]);
        const allFF = r.every(v => v === 0xff), allZero = r.every(v => v === 0);
        log(`  page ${page}: ${allFF ? '(all FF)' : allZero ? '(all 00)' : hex(r)}`);
      }
    }
    log('\nDone. Use "Copy result" and paste it into the chat.');
    document.getElementById('copy').disabled = false;
  } catch (e) {
    log('Error: ' + e.message, 'err');
  } finally {
    go.disabled = false;
    try { await dev.close(); } catch {}
  }
};
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(lines.join('\n'));
</script>
</body>
</html>
